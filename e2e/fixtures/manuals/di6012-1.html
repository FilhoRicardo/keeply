    <h1>Bosch DI6012-1 dishwasher</h1>
    <p>This manual covers dishwasher model DI6012-1.</p>
    <h2>Maintenance</h2>
    <p>Clean the filter once a month under running water.</p>
    <p>Descale the appliance every 6 months with a suitable descaler.</p>
    <p>Check the spray arms every 3 months and clear any blocked holes.</p>
