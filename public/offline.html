<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13733f" />
    <title>Keeply · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 22px;
        place-items: center;
        color: #1d2421;
        font-family: system-ui, sans-serif;
        background:
          radial-gradient(700px 520px at 8% -10%, rgba(20, 120, 72, 0.18), transparent 58%),
          linear-gradient(180deg, #eef1ef, #e1e7e3);
      }
      main {
        width: min(100%, 420px);
        padding: 22px;
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.55);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 14px 40px rgba(20, 40, 30, 0.09);
      }
      .mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 14px;
        color: white;
        font-size: 31px;
        background: linear-gradient(150deg, #2bb172, #0f6b3f);
      }
      h1 { margin: 18px 0 8px; font-size: 26px; letter-spacing: -0.02em; }
      p { margin: 0; color: #5a615b; font-size: 14px; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">✲</span>
      <h1>You’re offline</h1>
      <p>Reconnect to continue using Keeply. Your calendar is never changed without your Approval.</p>
    </main>
  </body>
</html>
